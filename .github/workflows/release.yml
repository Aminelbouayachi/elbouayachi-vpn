name: Build & Release Elbouayachi VPN

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install Dependencies
        run: npm install --legacy-peer-deps

      - name: Build Project
        run: npm run build

      - name: Package Dist for Download
        run: |
          cd dist
          zip -r ../elbouayachi-vpn-app.zip .
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        if: github.ref == 'refs/heads/main'
        with:
          tag_name: v1.0.0
          name: "Elbouayachi VPN v1.0.0"
          body: "🇲🇦 تطبيق Elbouayachi VPN جاهز للتحميل"
          files: elbouayachi-vpn-app.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
